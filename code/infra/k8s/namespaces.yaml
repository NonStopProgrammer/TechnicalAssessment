# INFRA-1.3: namespace separation — ingestion, retrieval, inference, agent,
# api, platform (observability/guardrails). Cross-namespace traffic is
# denied by default and only opened where NetworkPolicy explicitly allows
# it (see network-policies.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: ingestion
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
---
apiVersion: v1
kind: Namespace
metadata:
  name: retrieval
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
---
apiVersion: v1
kind: Namespace
metadata:
  name: inference
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
---
apiVersion: v1
kind: Namespace
metadata:
  name: api
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels: { app.kubernetes.io/part-of: finserv-compliance-assistant }
